<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Criar Cerca</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<!-- LOGIN CON GOOGLE -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🌿 Criar Cerca</h1>
    <p>Panel de administración</p>
    <button class="btn-google" id="btnGoogle" onclick="loginConGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Ingresar con Google
    </button>
    <p class="login-error" id="loginError" style="display:none">No tenés acceso al panel de administración.</p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-header">
    <h1>🌿 Criar Cerca — Admin</h1>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="userEmail" style="font-size:0.8rem;opacity:0.7;"></span>
      <button onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="admin-body">
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('solicitudes', this)">
        Solicitudes pendientes <span id="badgeSolicitudes"></span>
      </button>
      <button class="tab-btn" onclick="showTab('publicados', this)">
        Publicados
      </button>
    </div>

    <!-- TAB SOLICITUDES -->
    <div id="tabSolicitudes">
      <div class="section-title">Solicitudes pendientes de aprobación</div>
      <div id="listaSolicitudes">
        <div class="loading"><div class="spinner"></div>Cargando...</div>
      </div>
    </div>

    <!-- TAB PUBLICADOS -->
    <div id="tabPublicados" style="display:none">
      <div class="section-title">Servicios publicados en el directorio</div>
      <div id="listaPublicados">
        <div class="loading"><div class="spinner"></div>Cargando...</div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL EDICIÓN / APROBACIÓN -->
<div class="modal-overlay" id="editModal">
  <div class="modal-edit">
    <h2 id="editModalTitle">Completar y aprobar</h2>
    <div class="form-group">
      <label>Nombre del emprendimiento</label>
      <input type="text" id="editNombre" />
    </div>
    <div class="form-group">
      <label>Categoría</label>
      <select id="editCategoria">
        <option value="niñeras">Niñeras / Cuidado</option>
        <option value="fotografia">Fotografía</option>
        <option value="salud">Salud / Bienestar / Estimulación</option>
        <option value="ropa">Ropa y accesorios</option>
        <option value="alimentos">Alimentos</option>
        <option value="fiestas">🎉 Fiestas y Eventos</option>
        <option value="otros">Otros</option>
      </select>
    </div>
    <div class="form-group">
      <label>Descripción (HTML permitido)</label>
      <textarea id="editDescripcion"></textarea>
    </div>
    <div class="form-group">
      <label>Ubicación</label>
      <input type="text" id="editLocation" placeholder="Ej: Tandil, Barrio Norte" />
    </div>
    <div class="form-group">
      <label>WhatsApp (sin 54, sin espacios)</label>
      <input type="text" id="editWhatsapp" />
    </div>
    <div class="form-group">
      <label>Instagram (con @)</label>
      <input type="text" id="editInstagram" />
    </div>
    <div class="form-group">
      <label>URL de imagen (ibb.co u otro hosting)</label>
      <input type="text" id="editImage" placeholder="https://..." />
      <div id="editImagePreview"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
      <button class="btn-save" id="btnSaveModal" onclick="saveModal()">Guardar y publicar</button>
    </div>
  </div>
</div>

<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
