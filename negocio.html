<html lang="es">

<meta name="robots" content="noindex, follow" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<body>

<!-- HEADER -->
<header id="siteHeader"></header>

<!-- CONTENIDO -->
<section class="negocio-page">
  <div class="negocio-loading" id="negocioLoading">
    <div class="spinner"></div>
  </div>

  <div class="negocio-content" id="negocioContent" style="display:none">
    <a href="servicios.html" class="negocio-back">← Volver al directorio</a>
    <div class="negocio-header">
      <div class="negocio-image" id="negocioImage"></div>
      <div class="negocio-headinfo">
        <span class="negocio-cat" id="negocioCat"></span>
        <h1 id="negocioName"></h1>
        <span class="negocio-location" id="negocioLocation"></span>
      </div>
    </div>
    <div class="negocio-benefit" id="negocioBenefit" style="display:none"></div>
    <div class="negocio-desc" id="negocioDesc"></div>
    <div class="negocio-gallery" id="negocioGallery" style="display:none"></div>
    <div class="negocio-actions">
      <a href="#" class="negocio-contact" id="negocioContact" target="_blank">Contactar por WhatsApp</a>
      <a href="#" class="negocio-instagram" id="negocioInstagram" style="display:none" target="_blank"></a>
    </div>
  </div>

  <div class="negocio-notfound" id="negocioNotFound" style="display:none">
    <h1>No encontramos este negocio</h1>
    <p>Puede que ya no esté disponible en el directorio.</p>
    <a href="servicios.html">Ver todos los servicios →</a>
  </div>
